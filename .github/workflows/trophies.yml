
name: Generate GitHub Trophies

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create assets folder
        run: mkdir -p assets

      - name: Generate trophy SVG
        uses: satishjhanwer/github-profile-trophy@b2c3a39c30c85702cef60bcae2fac1f25992278a
        with:
          username: Prathiksha-2126
          output_path: assets/trophies.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit trophy image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/trophies.svg
          git diff --cached --quiet || git commit -m "Update trophies"
          git push
