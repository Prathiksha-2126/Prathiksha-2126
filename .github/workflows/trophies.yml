
name: Generate GitHub Trophies

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate trophy SVG
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: Prathiksha-2126
          output_path: assets/trophies.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit trophy image
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/trophies.svg
          git diff --cached --quiet || git commit -m "Update GitHub trophies"
          git push
